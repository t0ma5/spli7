name: Cutover pages bind once

# Temporary: inspect Pages project and attempt to serve Worker on spl1t.pages.dev.
# Delete after success.
on:
  workflow_dispatch:

jobs:
  bind:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Inspect and bind Pages ↔ Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          ACCT="$CLOUDFLARE_ACCOUNT_ID"

          echo "=== Smoke workers.dev ==="
          curl -sS -o /tmp/w -w "HTTP %{http_code}\n" "https://spl1t.contti.workers.dev/api/health/liveness" || true
          head -c 400 /tmp/w; echo

          echo "=== Pages projects (full names) ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects?per_page=50" | tee /tmp/pages.json | jq '{success, names: [.result[]?.name], projects: [.result[]? | {name, subdomain, domains, production_branch, source: .source.type}]}'

          echo "=== Pages project spl1t detail ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects/spl1t" | tee /tmp/proj.json | jq '{success, errors, name: .result.name, subdomain: .result.subdomain, domains: .result.domains, canonical: .result.canonical_deployment.id, latest: .result.latest_deployment.id, deployment_configs: .result.deployment_configs}'

          # Newer CF accounts: Workers Scripts can be aliased / connected. Try script settings domains.
          echo "=== Worker script details ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/services/spl1t" | jq '{success, errors, id: .result.id, default_environment: .result.default_environment.script}' || true
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/scripts/spl1t" | jq '{success, errors, id: .result.id, etag: .result.etag, has_assets: (.result | keys)}' || true

          # Attempt 1: Workers domain again (expect conflict if Pages owns DNS)
          echo "=== Workers domains PUT ==="
          curl -sS -X PUT "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/domains" \
            --data '{"hostname":"spl1t.pages.dev","service":"spl1t","environment":"production"}' | jq . || true

          # Attempt 2: If Pages project exists but empty, create a deployment that uses the Worker via pages_build_output_dir style is wrong.
          # Try Cloudflare "dispatch" / service binding from Pages to Worker — not always available.
          # Attempt 3: Delete conflicting approach — document only. Instead try enabling pages.dev on Worker via routes API on zone pages.dev (usually not available).

          # Attempt 4: Use wrangler to add custom domain (same API under the hood)
          npx wrangler domains add spl1t.pages.dev --name spl1t || true

          # Attempt 5: For empty Pages projects, some accounts support connecting an existing Worker:
          # PATCH pages project with unknown fields is risky; log only.
          echo "=== Try PATCH pages project (best-effort) ==="
          curl -sS -X PATCH "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects/spl1t" \
            --data '{"production_branch":"main"}' | jq '{success, errors, name: .result.name, domains: .result.domains}' || true

          echo "=== Final smoke pages + workers ==="
          for url in \
            "https://spl1t.contti.workers.dev/api/health/liveness" \
            "https://spl1t.contti.workers.dev/api/health/readiness" \
            "https://spl1t.pages.dev/api/health/liveness" \
            "https://spl1t.pages.dev/"
          do
            echo "GET $url"
            curl -sS -o /tmp/b -w "HTTP %{http_code}\n" --max-time 25 "$url" || echo "curl failed"
            head -c 200 /tmp/b; echo; echo
          done
