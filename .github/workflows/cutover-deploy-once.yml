name: Cutover deploy once

# Temporary one-shot deploy for Windows ARM hosts without workerd.
# Delete this workflow after a successful run.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          echo "Cloudflare secrets present"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker spl1t
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: List old/new worker secret names (values never shown)
        continue-on-error: true
        run: |
          echo "=== secrets on worker spliit (old) ==="
          npx wrangler secret list --name spliit || true
          echo "=== secrets on worker spl1t (new) ==="
          npx wrangler secret list --name spl1t || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Attach / verify pages.dev via Cloudflare API
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCT="$CLOUDFLARE_ACCOUNT_ID"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          echo "=== Pages projects ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects" | jq '{success, result: [.result[]? | {name, subdomain, domains: .domains}]}'

          echo "=== Workers scripts ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/scripts" | jq '{success, result: [.result[]? | .id]}'

          echo "=== Workers domains ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/domains" | jq .

          # Prefer attaching custom domain to the Worker when API allows.
          # pages.dev hostnames usually belong to a Pages project; try Workers domains + document outcome.
          echo "=== Attempt Workers domain attach for spl1t.pages.dev ==="
          curl -sS -X PUT "${AUTH[@]}" \
            "https://api.cloudflare.com/client/v4/accounts/${ACCT}/workers/domains" \
            --data '{"hostname":"spl1t.pages.dev","service":"spl1t","environment":"production"}' | jq . || true

          echo "=== Pages project spl1t (if present) ==="
          curl -sS "${AUTH[@]}" "https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects/spl1t" | jq '{success, errors, result: (.result | {name, subdomain, domains, production_branch, canonical_deployment?} // null)}' || true

      - name: Smoke test
        continue-on-error: true
        run: |
          for url in \
            "https://spl1t.pages.dev/api/health/liveness" \
            "https://spl1t.pages.dev/api/health/readiness" \
            "https://spl1t.t0ma5.workers.dev/api/health/liveness" \
            "https://spl1t.workers.dev/api/health/liveness"
          do
            echo "GET $url"
            curl -sS -o /tmp/body -w "%{http_code}\n" "$url" || echo "curl failed"
            head -c 200 /tmp/body || true
            echo
          done
